# Verifiche automatiche a ogni modifica: compila Lagotto, esegue i test e
# il banco di prova (file cancellati recuperati, sorgente mai modificata).
#
# Finché il repository è privato, i minuti di GitHub Actions sono
# limitati: a ogni modifica girano Fedora e Ubuntu; le altre tre
# distribuzioni girano quando il repository è pubblico o a mano
# (Actions → Checks → Run workflow).
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Which distributions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          PRIVATE: ${{ github.event.repository.private }}
          EVENT: ${{ github.event_name }}
        run: |
          base='{"name":"Fedora","distro":"fedora","image":"fedora:latest"},{"name":"Ubuntu 24.04 LTS","distro":"ubuntu","image":"ubuntu:24.04"}'
          extra='{"name":"Debian 13","distro":"debian","image":"debian:trixie"},{"name":"Arch Linux","distro":"arch","image":"archlinux:latest"},{"name":"openSUSE Tumbleweed","distro":"opensuse","image":"opensuse/tumbleweed:latest"}'
          if [ "$PRIVATE" = "true" ] && [ "$EVENT" != "workflow_dispatch" ]; then all="$base"; else all="$base,$extra"; fi
          echo "matrix={\"include\":[$all]}" >> "$GITHUB_OUTPUT"

  distro:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    container: ${{ matrix.image }}
    steps:
      - name: Git
        run: |
          case ${{ matrix.distro }} in
            fedora) dnf -y -q install git ;;
            ubuntu|debian) apt-get update -qq && apt-get install -y -qq git ca-certificates ;;
            arch) pacman -Sy --noconfirm --needed git ;;
            opensuse) zypper -n -q in git tar gzip ;;
          esac
      - uses: actions/checkout@v5
      - name: Install what Lagotto needs
        run: 'ci/run.sh "${{ matrix.name }} - install" ci/deps.sh ${{ matrix.distro }}'
      - name: Build, test, test bench
        run: 'ci/run.sh "${{ matrix.name }} - checks" ci/check.sh'

  style:
    name: Code style and metadata
    runs-on: ubuntu-latest
    container: "fedora:latest"
    steps:
      - run: dnf -y -q install git
      - uses: actions/checkout@v5
      - run: ci/deps.sh fedora
      - run: dnf -y -q install rustfmt clippy
      - name: Formatting
        run: ci/run.sh Formatting cargo fmt --all --check
      - name: Lints
        run: ci/run.sh Lints cargo clippy --locked --all-targets -- -D warnings
      - name: Menu entry
        run: ci/run.sh "Menu entry" desktop-file-validate data/io.github.outlook791.Lagotto.desktop
      - name: Store metadata
        run: ci/run.sh "Store metadata" appstreamcli validate --no-net --explain data/io.github.outlook791.Lagotto.metainfo.xml

  package:
    name: Main package (RPM)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: "fedora:latest"
    steps:
      - run: dnf -y -q install git
      - uses: actions/checkout@v5
      - run: ci/deps.sh fedora
      - run: dnf -y -q install rpm-build
      - name: Build the RPM
        run: ci/run.sh "RPM - build" scripts/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lagotto-rpm
          path: dist/*.rpm
          retention-days: 30

  install:
    name: Install the package on a clean Fedora
    needs: package
    runs-on: ubuntu-latest
    container: "fedora:latest"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lagotto-rpm
          path: dist
      - name: Install and try
        run: |
          dnf -y -q install ./dist/*.rpm desktop-file-utils
          lagotto --help
          test -x /usr/libexec/lagotto-helper
          test -f /usr/share/polkit-1/actions/io.github.outlook791.Lagotto.policy
          grep -q '^gpgcheck=1' /etc/yum.repos.d/lagotto.repo
          desktop-file-validate /usr/share/applications/io.github.outlook791.Lagotto.desktop
          command -v fls && command -v photorec
          printf '{"op":"quit"}\n' | /usr/libexec/lagotto-helper serve | grep -q '"ok":true'
          echo "Package OK"

  repository:
    name: Updates repository (signed, installed with dnf)
    needs: package
    runs-on: ubuntu-latest
    container: "fedora:latest"
    steps:
      - run: dnf -y -q install git
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: lagotto-rpm
          path: dist
      - name: Sign with a throwaway key, build the repository, install from it
        run: |
          dnf -y -q install gnupg2
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --quiet --pinentry-mode loopback --passphrase '' \
            --quick-gen-key "Lagotto test <test@example.invalid>" rsa4096 sign never
          RPM_SIGNING_KEY="$(gpg --batch --armor --export-secret-keys)" scripts/sign-and-repo.sh
          unset GNUPGHOME
          sed -e "s|https://outlook791.github.io/Lagotto/rpm/|file://$PWD/site/rpm/|" \
              packaging/lagotto.repo > /etc/yum.repos.d/lagotto.repo
          dnf -y -q install lagotto
          rpm -q lagotto
          rpm -qi lagotto | grep -i '^Signature' | grep -vi none
          echo "Repository OK"

