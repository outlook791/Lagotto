[workspace]
resolver = "2"
members = ["crates/lagotto-core", "crates/lagotto-helper", "crates/lagotto-cli", "crates/lagotto-ui"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["outlook791"]
repository = "https://github.com/outlook791/Lagotto"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true
